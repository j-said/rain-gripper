[package]
name = "mqtt_listener"
version = "0.1.0"
edition = "2024"

[dependencies]
rumqttc = "0.25.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "uuid",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11.8"
chrono = { version = "0.4", features = ["serde"] }
